name: Build macOS DMG

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Universal 2 Python
        run: |
          curl -fL https://www.python.org/ftp/python/3.12.10/python-3.12.10-macos11.pkg -o /tmp/python.pkg
          sudo installer -pkg /tmp/python.pkg -target /
          /Library/Frameworks/Python.framework/Versions/3.12/bin/python3 -c 'import platform, tkinter; print(platform.platform()); print(tkinter.TkVersion)'

      - name: Install dependencies
        run: /Library/Frameworks/Python.framework/Versions/3.12/bin/python3 -m pip install -r requirements.txt

      - name: Build app and DMG
        run: |
          chmod +x build_dmg.sh
          ./build_dmg.sh

      - name: Inspect artifact
        run: |
          file "dist/FEMBABE USB.app/Contents/MacOS/FEMBABE USB"
          lipo -archs "dist/FEMBABE USB.app/Contents/MacOS/FEMBABE USB"
          file dist/FEMBABE-USB-macOS.dmg
          codesign --verify --deep --strict --verbose=4 "dist/FEMBABE USB.app"
          codesign -dv --verbose=4 "dist/FEMBABE USB.app" 2>&1
          hdiutil imageinfo dist/FEMBABE-USB-macOS.dmg

      - name: Launch smoke test
        run: |
          FEMBABE_DEMO=1 "dist/FEMBABE USB.app/Contents/MacOS/FEMBABE USB" &
          APP_PID=$!
          sleep 5
          kill -0 "$APP_PID"
          kill "$APP_PID"

      - name: Upload DMG and app
        uses: actions/upload-artifact@v4
        with:
          name: FEMBABE-USB-macOS
          path: |
            dist/FEMBABE-USB-macOS.dmg
            dist/FEMBABE USB.app
          if-no-files-found: error
